# 微课堂 V2 —— EVO4（fnOS）正式部署编排
#
# 用法（在 EVO4 上，工作目录为含 .env 的目录）：
#   sudo docker compose -f compose.evo4.yml up -d         # 启动/更新
#   sudo docker compose -f compose.evo4.yml ps            # 状态
#   sudo docker compose -f compose.evo4.yml logs -f       # 日志
#   sudo docker compose -f compose.evo4.yml down          # 停止（保留数据卷）
#
# 版本：镜像与容器版本号都读环境变量 MC_VERSION，**必须**在 .env 里显式给出。
#   升级时用 `MC_VERSION=x.y.z docker compose -f compose.evo4.yml up -d --force-recreate --no-deps api`，
#   或直接用仓库脚本 ops/deploy/build-image.sh + ops/deploy/redeploy.sh（自动带版本并校验）。
#   为什么不再回退默认值：曾经因为 .env 里残留 MC_VERSION=2.0.0，NAS UI 点「重构」后
#   compose 按默认值去拉 microclass:2.0.0（本机并不存在该标签），结果服务起不来、
#   8091 被另一套旧部署占住，页面主题/版本回退。现在缺 MC_VERSION 会直接报错而不是静默用旧镜像。
#
# 说明：
# - 项目名固定为 microclass-prod：宿主机上还有一套历史部署（/opt/microclass，项目名 microclass）
#   与它共享过网络名 microclass_default，对方「重构」会把本项目的网络重建掉（容器 exit 128）。
#   改项目名后两者网络彻底隔离。
# - 数据卷 microclass_data 由外部创建（external），内含既有数据，编排不会重建它；
# - user 必须与媒体目录属主一致（EVO4 上是 1000:1000），否则视频会返回 403，详见 docs/deploy.md；
# - 8091 为默认端口，8093 保留为历史入口，两个端口指向同一实例。
name: microclass-prod

services:
  # PostgreSQL 16：数据层（P0 迁移目标）。数据放 NVMe 系统盘（/var/lib/microclass-pg），
  # 端口只绑 127.0.0.1 供运维排查；api 走 compose 内网 db:5432，不经过宿主端口。
  # 备份：pg_dump 必须纳入日常备份；升级 fnOS 不会动 /var/lib 之外的卷，但重装系统会，需单独备份。
  db:
    image: postgres:16-alpine
    container_name: microclass-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: microclass
      POSTGRES_USER: microclass
      POSTGRES_PASSWORD: ${MC_PG_PASSWORD:?请在 .env 设置 MC_PG_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - postgres
      # 16G 内存的 NAS：shared_buffers ≈ 25%，留给页缓存和 ffmpeg
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      # NVMe：随机读代价接近顺序读
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      # 慢查询：>200ms 记日志，排查阻塞用
      - -c
      - log_min_duration_statement=200
      - -c
      - log_checkpoints=on
      - -c
      - timezone=Asia/Shanghai
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - /vol1/1000/microclass-pg:/var/lib/postgresql/data
    shm_size: 512mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U microclass -d microclass
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  api:
    image: microclass:${MC_VERSION:?请设置 .env 的 MC_VERSION（例如 MC_VERSION=2.3.0）}
    container_name: microclass-api
    restart: unless-stopped
    user: '1000:1000'
    environment:
      MC_ENV: production
      MC_HOST: 0.0.0.0
      MC_PORT: '8091'
      MC_SITE_NAME: ${MC_SITE_NAME:-微课堂}
      MC_VERSION: ${MC_VERSION:?请设置 .env 的 MC_VERSION（例如 MC_VERSION=2.3.0）}
      MC_ADMIN_USER: ${MC_ADMIN_USER:-admin}
      # 仅在首次初始化（库中没有 admin）时使用；已有账号不会被覆盖
      MC_ADMIN_PASS: ${MC_ADMIN_PASS:?请在 .env 中设置 MC_ADMIN_PASS}
      MC_ALLOW_REGISTER: ${MC_ALLOW_REGISTER:-true}
      MC_MAX_UPLOAD_MB: ${MC_MAX_UPLOAD_MB:-200}
      MC_LOG_LEVEL: ${MC_LOG_LEVEL:-info}
      MC_TRUST_PROXY: ${MC_TRUST_PROXY:-1}
      # 反代/域名访问的 Origin 白名单（逗号分隔；支持 https://*.example.com）
      # 不传这个变量时，应用只会用 Host/X-Forwarded-Host 推导自身地址，
      # 反代若改写 Host（常见），浏览器登录会被 403「Origin 不被信任」拦掉。
      MC_ALLOWED_ORIGINS: ${MC_ALLOWED_ORIGINS:-}
      # 数据层开关：sqlite（默认，行为不变）| pg（P0 切流后启用）
      MC_DB: ${MC_DB:-sqlite}
      MC_PG_URL: ${MC_PG_URL:-}
      TZ: Asia/Shanghai
    ports:
      - '8091:8091'
      - '8093:8091'
    volumes:
      - microclass_data:/app/data
      # 媒体目录：按实际路径挂载（只读）；容器内路径需与库中 settings.media_roots 的 path 一致
      - /vol1/1000/JAVA课:/media/java:ro
      - /vol1/1000:/media/nas:ro
      - /vol1:/vol1:ro
      # 思酷睿课程（小学数学 / 初中数学 / 高中数学 / 初中物理·化学 / 高中物理）
      - /vol2/1000/思酷睿课程:/media/sikuruike:ro
      # 题库包导入目录（只读）：题库包直接在宿主机上解包，导入时不用 docker cp 进容器
      #   docker exec microclass-api node /app/ops/scripts/import-bank-manifest.mjs /import/unpacked/<包名>
      - /vol1/1000/microclass-bank-import:/import:ro
    deploy:
      resources:
        limits:
          # ffmpeg 抽帧/取时长会比较吃内存，1g 在批量导入时被 cgroup OOM 杀过一次，给足 2g
          memory: 2g
        reservations:
          memory: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8091/api/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      # 部署/重启瞬间会有一段冷页加载 + IO 竞争窗口（2026-11-26 实测约 2 分钟），
      # 给足 start_period 与重试次数，避免看门狗把正常启动误判成故障而重启。
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  microclass_data:
    external: true
